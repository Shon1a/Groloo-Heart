# CI for groloo-core.
#
# Four jobs, each guarding a distinct class of failure. The third is the reason
# this file was rewritten rather than copied from Groloo-Heart; the fourth is the
# reason it was rewritten a second time.
#
#   check     Correctness and style of the Rust that a human reads.
#             Guards against: unformatted code, a lint the no-panic wall in
#             crates/groloo-core/src/lib.rs is supposed to catch, a broken
#             boundary test, and a release profile (lto + opt-level="z" +
#             panic="unwind") that compiles on a dev machine but not from clean.
#             Every build/test invocation is --locked, so a Cargo.lock that has
#             drifted from the manifests is a build failure. Heart gitignored its
#             lockfile entirely, which is why no two builds of the shipped .wasm
#             ever provably used the same dependency graph.
#
#   wasm      The binding crate against its real target.
#             Guards against: code that is fine on x86_64 and wrong or
#             unbuildable on wasm32-unknown-unknown. Host `cargo test` cannot
#             reach groloo-core-wasm at all, so without this job the crate that
#             actually ships is the only crate nothing checks.
#
#   artifact  THE FRESHNESS GATE. Guards against the specific, silent, shipped
#             failure Heart had: `web/` was a hand-committed build output that CI
#             never rebuilt and never compared, so a source change with no manual
#             rebuild shipped a STALE core to every client behind a green tick.
#             This job rebuilds the module from source with the pinned toolchain
#             and refuses the commit unless the committed bytes match. It also
#             enforces a size ceiling, because a core that doubles in size is
#             caught at review time rather than on a television over hotel wifi.
#             What the comparison does and does not catch is documented in full
#             at the top of .github/scripts/verify-artifact.mjs — read it before
#             trusting or weakening this job.
#
#   gates     THE BEHAVIOURAL GATES — tests/differential and tests/parity.
#             Guards against: a change that compiles, is formatted, lints clean,
#             passes every unit test and rebuilds to the right bytes, and STILL
#             changes what a user sees. Nothing above this job can catch that.
#             `cargo test` asserts the core against its own expectations; these
#             two runs assert it against the implementations it is replacing —
#             the vendored 0.1.0-5ecaa78 wasm serving the app today, and the
#             TypeScript in Groloo-Web / the JavaScript in Groloo-server.
#
#             Neither was wired in here before, which is how a regression stayed
#             invisible until someone thought to run it by hand: the U-slash
#             defect (a manifest URL that fetches today, normalised into one that
#             404s) sat in `addon::normalize_manifest_url` behind a green CI.
#             Both now run with --strict, and read the long note on that flag in
#             the job itself before touching it.
#
# The toolchain is NOT chosen here. rust-toolchain.toml pins 1.96.1 with rustfmt,
# clippy and the wasm32 target, and rustup on the runner honours it automatically.
# Naming a toolchain in this file would let CI and a developer's machine disagree
# about which compiler produced the artifact, which is exactly the ambiguity the
# freshness gate exists to remove.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail fast and loud on a network hiccup rather than half-resolving a graph.
  CARGO_NET_RETRY: 3

  # SIZE BUDGET — the ceilings the artifact job enforces, in bytes.
  #
  # Set from a measured build of this workspace at its current 18-function export
  # surface (26 entries in the wasm export table), not from a wish:
  #
  #   groloo_core_wasm_bg.wasm   358,925 B   ceiling 409,600 B (400 KiB, +14%)
  #   groloo_core_wasm.js         24,415 B   ceiling  32,768 B  (32 KiB, +34%)
  #
  # A ceiling many times the real figure catches nothing, so these are deliberately
  # close to it. The artifact job prints percentage-of-budget on every run, so the
  # remaining slack is never invisible and the trend is readable from the log.
  #
  # WORTH KNOWING, and not what was expected: the module is currently LARGER than
  # the Groloo-Heart build Groloo-Web ships today (244,077 B of .wasm, 32,585 B
  # of glue) despite dropping Heart's Elm runtime and its 304 hand-written
  # bindings. The glue did collapse as intended — 24 KB against 32 KB, for MORE
  # exported functions — but the wasm grew ~47%, which points at the serde derive
  # and formatting surface rather than at the binding layer. That is a real finding
  # for whoever owns the crates, not something for this budget to paper over: the
  # right response is to measure it (twiggy / `wasm-opt -Oz`) and ratchet the
  # ceiling down, never to raise it quietly.
  #
  # Raising either number is a deliberate, reviewable one-line commit — never a fix
  # bundled into the change that caused the growth.
  WASM_BUDGET_BYTES: 409600
  JS_BUDGET_BYTES: 32768

defaults:
  run:
    # pipefail is not the default for `run:` steps, and this workflow pipes curl
    # into tar. Without it a failed download extracts nothing and reports success.
    shell: bash

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `cargo --version` is a rustup PROXY call, and it is the proxies — not
      # `rustup show`, which stopped auto-installing in rustup 1.28 — that
      # materialise the toolchain named in rust-toolchain.toml along with its
      # components and targets. Everything after it is an assertion: if the pin
      # did not take, this fails here with an obvious message rather than fifty
      # lines later inside a clippy invocation.
      - name: Install the pinned toolchain
        run: |
          cargo --version
          rustup show active-toolchain
          rustc --version
          cargo fmt --version
          cargo clippy --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Build (native release)
        run: cargo build --locked --release --workspace

  wasm:
    name: wasm32 clippy / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # See the note in the `check` job: the proxy call is what installs. The
      # wasm32 target comes from rust-toolchain.toml, so its absence means the
      # pin was not honoured — assert it rather than discover it as a confusing
      # "can't find crate for `core`" further down.
      - name: Install the pinned toolchain
        run: |
          cargo --version
          rustup show active-toolchain
          rustup target list --installed | grep -qx wasm32-unknown-unknown

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Clippy (wasm32)
        run: |
          cargo clippy --locked --target wasm32-unknown-unknown \
            -p groloo-core-wasm -- -D warnings

      - name: Build (wasm32 release)
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown \
            -p groloo-core-wasm

  artifact:
    name: artifact freshness + size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The compiler identity is load-bearing for this job specifically: codegen
      # differs between rustc versions, so a toolchain that is not the pinned one
      # would reject a perfectly fresh artifact. Printed, then asserted.
      - name: Install the pinned toolchain
        run: |
          cargo --version
          rustup show active-toolchain
          rustc --version
          rustup target list --installed | grep -qx wasm32-unknown-unknown
          node --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      # The CLI version must EQUAL the wasm-bindgen crate version or the emitted
      # JS shim can be silently wrong, so it is read from Cargo.lock rather than
      # written down twice. build-wasm.sh re-asserts the equality before building
      # — this step only has to install the right one.
      - name: Install wasm-bindgen CLI (version pinned by Cargo.lock)
        run: |
          VER=$(awk '
            /^name = "wasm-bindgen"$/ { seen = 1; next }
            seen && /^version = / { gsub(/[",]/, ""); print $3; exit }
          ' Cargo.lock)
          if [ -z "$VER" ]; then
            echo "::error::could not read the wasm-bindgen version from Cargo.lock"
            exit 1
          fi
          echo "pinned wasm-bindgen: $VER"
          DEST="$HOME/.wasm-bindgen"
          rm -rf "$DEST"
          mkdir -p "$DEST/bin"
          URL="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${VER}/wasm-bindgen-${VER}-x86_64-unknown-linux-musl.tar.gz"
          if curl -fsSL --retry 3 "$URL" | tar -xz -C "$DEST/bin" --strip-components=1; then
            echo "installed from the official release tarball"
          else
            # Slower but produces the same pinned version, so the gate stays
            # meaningful when GitHub's release asset naming or hosting moves.
            # The directory is wiped first: a half-extracted binary left by the
            # failed download would otherwise shadow the one cargo builds.
            echo "release tarball unavailable; building the CLI from crates.io"
            rm -rf "$DEST"
            cargo install wasm-bindgen-cli --version "$VER" --locked --root "$DEST"
          fi
          "$DEST/bin/wasm-bindgen" --version
          echo "$DEST/bin" >> "$GITHUB_PATH"

      - name: Require a committed artifact
        run: |
          if [ ! -f pkg/groloo_core_wasm_bg.wasm ]; then
            echo "::error::pkg/groloo_core_wasm_bg.wasm is not committed."
            echo "The wasm-bindgen output is a versioned deliverable here, not a build"
            echo "by-product: Groloo-Web loads exactly these bytes from a pinned folder."
            echo "Produce it with 'bash .github/scripts/build-wasm.sh pkg' and commit it."
            exit 1
          fi
          ls -l pkg

      # build.rs stamps <semver>+g<rev> into the module, and the committed
      # artifact necessarily records the revision that existed BEFORE the commit
      # carrying it — so a rebuild at HEAD can never reproduce that field. Pin it
      # to whatever the committed module already says instead of excluding it
      # from the comparison; gate [5] separately proves the semver half is honest.
      - name: Read the committed module's build stamp
        id: stamp
        run: |
          REV=$(node .github/scripts/wasm-summary.mjs pkg/groloo_core_wasm_bg.wasm --rev)
          echo "committed build stamp revision: $REV"
          echo "rev=$REV" >> "$GITHUB_OUTPUT"

      # Invoked through `bash` rather than executed directly: this repository is
      # authored from Windows, where git does not reliably record the exec bit.
      #
      # `steps.stamp.outputs.rev` is interpolated from bytes read out of a
      # committed binary, so it is worth being explicit that it is safe: the
      # regex in wasm-summary.mjs admits only [0-9a-f]{7,40} or the literal
      # `unknown`, which contains nothing a shell would act on.
      - name: Rebuild the artifact from source
        run: |
          bash .github/scripts/build-wasm.sh \
            "$RUNNER_TEMP/pkg-rebuilt" "${{ steps.stamp.outputs.rev }}"

      - name: Verify freshness and size budget
        run: |
          node .github/scripts/verify-artifact.mjs \
            --committed pkg \
            --rebuilt "$RUNNER_TEMP/pkg-rebuilt" \
            --max-wasm-bytes "$WASM_BUDGET_BYTES" \
            --max-js-bytes "$JS_BUDGET_BYTES"

      # Uploaded on success and on failure alike. When the gate goes red the
      # single most useful thing a reviewer can have is the bytes CI produced,
      # ready to drop into pkg/ — not a log line telling them to rebuild.
      - name: Upload the rebuilt artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkg-rebuilt-${{ github.sha }}
          path: ${{ runner.temp }}/pkg-rebuilt
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # gates — the two differential corpora
  # ---------------------------------------------------------------------------
  #
  # THIS JOB NEEDS ALL THREE REPOSITORIES, and that is not an inconvenience to be
  # engineered around — it is the entire point. tests/parity compares the core
  # against the TypeScript that ships (Groloo-Web/src/lib/addonClient.ts,
  # src/stores/addons.ts) and the JavaScript that ships (Groloo-server/server/
  # server.js), IMPORTED AND RUN, never transcribed. tests/differential compares
  # it against the vendored 0.1.0-5ecaa78 wasm, which also lives in Groloo-Web.
  # A version of this job that stubbed any of that would be testing the stub.
  #
  # The three checkouts are laid out as siblings because that is the layout both
  # harnesses resolve (`resolve(REPO, '..', 'Groloo-Web')`):
  #
  #     $GITHUB_WORKSPACE/
  #       groloo-core/     <- this repository
  #       Groloo-Web/
  #       Groloo-server/
  #
  # WHY THIS JOB FAILS RATHER THAN SKIPS when the sibling checkouts are not
  # available. A skipped gate reports the same green tick as a passed one, and
  # this whole phase exists because a green tick was mistaken for evidence. If
  # SIBLING_REPOS_TOKEN is missing the job goes red and says what to configure,
  # which is a question for a person and not a silent pass.
  gates:
    name: differential + parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: groloo-core

      # A PAT (or a fine-grained token) with `contents: read` on both sibling
      # repositories. `github.token` cannot do this: it is scoped to the
      # repository that triggered the run and nothing else.
      - name: Require the sibling-repository token
        # Read through `env:` rather than interpolated into the script text: a
        # secret spliced into a shell body is a quoting bug waiting for a token
        # that contains a quote.
        env:
          SIBLING_REPOS_TOKEN: ${{ secrets.SIBLING_REPOS_TOKEN }}
        run: |
          if [ -z "$SIBLING_REPOS_TOKEN" ]; then
            echo "::error::SIBLING_REPOS_TOKEN is not configured, so the two behavioural gates cannot run."
            echo "tests/parity imports the REAL Groloo-Web TypeScript and lifts the REAL"
            echo "Groloo-server JavaScript; tests/differential reads the vendored wasm out of"
            echo "Groloo-Web/public/assets. None of that can be stubbed without testing the stub."
            echo "Add a repo secret SIBLING_REPOS_TOKEN with contents:read on Shon1a/Groloo-Web"
            echo "and Shon1a/Groloo-server. This job fails rather than skipping on purpose: a"
            echo "skipped gate and a passed gate print the same green tick."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: Shon1a/Groloo-Web
          path: Groloo-Web
          token: ${{ secrets.SIBLING_REPOS_TOKEN }}
          # Full history. tests/parity quotes the pre-port twins with `git show
          # <PRE_PORT_REV>:`, and a depth-1 checkout has no revision to quote.
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: Shon1a/Groloo-server
          path: Groloo-server
          token: ${{ secrets.SIBLING_REPOS_TOKEN }}

      # >= 23.6, because tests/parity imports the twins as .ts and executes the
      # bytes in the repository: node's own type stripping is what makes "imported
      # and run" true rather than "transpiled and run".
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Groloo-Web/package-lock.json

      - name: Install the pinned toolchain
        working-directory: groloo-core
        run: |
          cargo --version
          rustup show active-toolchain
          rustup target list --installed | grep -qx wasm32-unknown-unknown
          node --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('groloo-core/Cargo.lock', 'groloo-core/rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      # Both harnesses run `scripts/build-wasm.mjs --no-vendor` and refuse to
      # evaluate a fixture unless the freshly-built bytes equal the vendored ones
      # — so the gates enforce artifact freshness ACROSS repositories, which the
      # `artifact` job above cannot see. That check has no skip flag by design.
      - name: Install wasm-bindgen CLI (version pinned by Cargo.lock)
        working-directory: groloo-core
        run: |
          VER=$(awk '
            /^name = "wasm-bindgen"$/ { seen = 1; next }
            seen && /^version = / { gsub(/[",]/, ""); print $3; exit }
          ' Cargo.lock)
          if [ -z "$VER" ]; then
            echo "::error::could not read the wasm-bindgen version from Cargo.lock"
            exit 1
          fi
          DEST="$HOME/.wasm-bindgen"
          rm -rf "$DEST"
          mkdir -p "$DEST/bin"
          URL="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${VER}/wasm-bindgen-${VER}-x86_64-unknown-linux-musl.tar.gz"
          if curl -fsSL --retry 3 "$URL" | tar -xz -C "$DEST/bin" --strip-components=1; then
            echo "installed from the official release tarball"
          else
            rm -rf "$DEST"
            cargo install wasm-bindgen-cli --version "$VER" --locked --root "$DEST"
          fi
          "$DEST/bin/wasm-bindgen" --version
          echo "$DEST/bin" >> "$GITHUB_PATH"

      # The corpus imports the REAL zustand store rather than stubbing it —
      # addonClient.ts reads `useAddons.getState().installed`, and a stub there
      # would mean the fixtures drove the harness's idea of an installed add-on
      # instead of the app's. So Groloo-Web's dependencies are a hard requirement.
      - name: Install Groloo-Web dependencies
        working-directory: Groloo-Web
        run: npm ci

      # PRE_PORT_REV IS THE ONE THING THIS JOB CANNOT CHECK FOR YOU, and it is
      # worth knowing about before you read a red run below.
      #
      # tests/parity compares the core against TypeScript that has already been
      # DELETED from Groloo-Web's working tree, so it quotes those twins out of
      # git at `PRE_PORT_REV` (tests/parity/twins.mjs). That constant is `'HEAD'`,
      # which is correct for exactly as long as the deletions stay UNCOMMITTED —
      # HEAD is then, by construction, the last all-TypeScript revision.
      #
      # THE MOMENT THE DELETIONS ARE COMMITTED, `git show HEAD:` returns the core
      # CALL SITE. Both sides of every comparison become `callData(...)`, the
      # corpus compares the core against itself, and a comparison that cannot fail
      # gets reported as parity. That is the exact defect this gate was rebuilt to
      # remove, so `assertNotACoreCallSite` detects it and refuses to run, naming
      # the revision to pin and the `git log -S` incantation that finds it. The
      # `--prove` step below fires that guard on real bytes, in both directions,
      # so it is a guard somebody has checked and not one nobody has.
      #
      # WHOEVER COMMITS THE addonClient.ts DELETIONS OWNS PINNING PRE_PORT_REV in
      # the same change. Not afterwards: between the commit and the pin, this job
      # is red for a reason that looks like a bug in the Rust.
      - name: Prove both gates can go red
        working-directory: groloo-core
        run: |
          node tests/differential/run.mjs --prove
          node tests/parity/run.mjs --prove

      # --strict, and it is not negotiable downward.
      #
      # Interactively both runners exit 0 on an UNPLANNED divergence, because an
      # unplanned divergence is a question for a person rather than a broken build
      # — it is printed in its own section with its own summary line and it blocks
      # its family's twin from being deleted. In CI that reasoning inverts: nobody
      # is reading the output, so "there is a behaviour change nobody signed off"
      # has to be a failure or it is nothing at all. --strict also fails on a stale
      # `heart.ts` pin, i.e. an artifact the browser does not fetch.
      #
      # If this step is red because a divergence is unplanned, the fix is to DECIDE
      # IT — fix the Rust to match, or declare it with a justification next to the
      # fixture — never to drop the flag. A fixture may only move from "unplanned
      # divergence" to "match" because the CODE changed to make it match.
      # KNOWN RED THE FIRST TIME THIS RUNS, and both reasons are correct:
      #
      #   U1  `reconcile_install_state` and an empty remote map — 0.1.0 decided
      #       remote-present as `!map.is_empty()`, the new core decides on
      #       `remote != null` and therefore adopts. Documented under "Not declared
      #       — still open" in tests/differential/DIVERGENCES.md, where it says in
      #       as many words that it needs a decision from a person. --strict is
      #       what makes that decision unavoidable instead of perennially deferred.
      #
      #   the vendored artifact is stale — the parity fixes landed in the crates
      #       and Groloo-Web/public/assets/groloo-core/ was not re-vendored, so
      #       BOTH gates throw before evaluating a fixture ("THE VENDORED ARTIFACT
      #       IS NOT WHAT THIS TREE BUILDS"). Fix with `node scripts/build-wasm.mjs
      #       --prune` and the two lines it prints for src/lib/heart.ts.
      #
      # Neither is a reason to relax anything here. Wiring a gate in and then
      # tuning it until it is green on day one is how the previous one ended up
      # unable to fail.
      - name: Differential gate — new core vs the live vendored 0.1.0 artifact
        working-directory: groloo-core
        run: node tests/differential/run.mjs --strict

      - name: Parity gate — the core vs the TypeScript and JavaScript that ship
        working-directory: groloo-core
        run: node tests/parity/run.mjs --strict
